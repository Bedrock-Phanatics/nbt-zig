name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet --version
      - run: dotnet build CsNbt.slnx --configuration Release
      - run: dotnet run --project tests/CsNbt.Tests --configuration Release --no-build
